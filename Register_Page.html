<!DOCTYPE html>
<html lang="id">
    <style>
   body {
  font-family: Arial, Helvetica, sans-serif;
  margin: 0px;
}

table {
  font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
  border-collapse: collapse;
  margin: 0 auto;
  width: 100%;
  height: 100vh;
}

th, td {
  border: 1px solid black;
  padding: 10px 15px;
  text-align: center;
}

.Up-RFM {
  background-color: rgba(187, 158, 106, 0.615);
  padding: 8px;
  border-radius: 5px;
  border: 2px solid black;
}

.Up-RFM h1 {
  font-size: 22px; /* Dikecilkan dari default h1 */
  margin: 5px 0;
}

.gambar {
  background-color: rgba(62, 56, 56, 0.908);
  margin: 0 auto;
  width: 40%;
}

.gambar img {
  width: 100%;
  display: block;
}

.RFM {
  background-color: rgba(77, 68, 64, 0.76);
  padding: 20px;
}

.Regist-Form {
  padding: 20px;
  background-color: rgba(150, 139, 107, 0.541);
  border: 1px solid black;
  border-radius: 5px;
  text-align: left;
}

.Regist-Form label {
  color: white;
  font-size: 15px; /* Dikecilkan dari 30px */
  font-weight: bold;
}

.Regist-Form input {
  padding: 10px 12px; /* Dikecilkan */
  width: 100%;        /* Dibuat responsif memenuhi container */
  box-sizing: border-box; /* Biar padding gak bikin input kelewatan lebar */
  border: 1px solid black;
  border-radius: 6px;
  font-size: 14px;    /* Dikecilkan dari 20px */
}

input::placeholder {
  font-size: 14px;
}

.button-sbmit button {
  background-color: rgba(0, 0, 0, 0.996);
  color: white;
  padding: 12px;      /* Dikecilkan dari 20px */
  font-size: 15px;    /* Dikecilkan dari 20px */
  border-radius: 6px;
  width: 100%;
  cursor: pointer;
  border: none;
  transition: 0.3s;
  letter-spacing: 1px;
}

.button-sbmit button:hover {
  transform: translateY(-2px);
}

input:focus {
  outline: none;
  border: 2px solid black;
}

.RFM-Footer {
  background-color: rgba(77, 65, 65, 0.908);
  padding: 15px;
  vertical-align: middle;
  color: white;
  font-size: 13px;
}

        

    </style>

        <tr>
